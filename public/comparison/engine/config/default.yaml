# AutoCheck rule configuration. Every threshold / list used by a check lives here so the tool
# stays generic across boards. Copy this file per project and pass it with --config.
# Lines marked "CONFIRMED" were stated by the design owner; "DEFAULT" are tool defaults pending review.

rules_version: "0.2.0"

parts:
  # 2-pin non-polarized parts: swapping their two pins is electrically equivalent (diff noise rule)
  symmetric_prefixes: [R, C, L, FB, F, RS, VS]
  # part prefixes considered "active" (used by floating-pin and circuit-text features)
  active_prefixes: [U, Q, J, CN, D, DS]
  # copper-only parts that never appear in the BOM but always exist on the board (DEFAULT)
  always_built_prefixes: [TP]
  # mechanical / non-electrical BOM items that legitimately have no netlist entry   (DEFAULT)
  mechanical_refdes_regex: '^(TIM|TTP|MEC|H|LBL|HS|SCREW|NUT|PCB)\d*$'

dnp:
  # CONFIRMED (owner, 2026-10-22): the naming rule marks a not-installed part NI; Capture CIS stores it in the part
  # instance property Optional (values seen: NI / I / N/A; CATANIA EVT also one 'NOBOM', not treated as DNP: DEFAULT).
  dsn_property: [Optional]
  dsn_values: [NI]
  # with these BOM formats the BOM alone decides DNP and DSN NI is only cross-checked (BOM_NI_CONFLICT);
  # any other BOM (OrCAD Capture report lists every placed part) or no BOM: DSN NI parts are DNP
  company_bom_formats: [ERP, Agile, NVIDIA]
  conflict_severity: WARN

ground:
  main: GND
  # nets treated as ground (0 V). Full-match regex.                                (DEFAULT)
  regex: '^(?:[ADPSC]?GND\d*|GND_?[A-Z0-9]*|VSS)$'
  # stuffed parts that tie two nets to the same potential (for ground-island + voltage propagation)
  tie_prefixes: [FB, F]
  # copper net-ties / short pins: never in the BOM, always present            (DEFAULT)
  nettie_prefixes: [VS, NT]
  nettie_name_regex: 'SHORT|NET_?TIE'
  tie_max_ohm: 0.05          # R / RS at or below this value count as a tie (0R jumpers, mOhm shunts)

capacitor:
  # CONFIRMED (owner, 2026-10-08, rule A): MLCC rated voltage ~2 x working voltage, rounded to a
  # common rating. Required = smallest standard rating >= factor x V x (1 - tolerance).
  # e.g. 3.3 V -> 6.3 V, 5 V -> 10 V, 12 V -> 25 V, 48 V -> 100 V
  mlcc_derating_factor: 2.0
  mlcc_tolerance: 0.05
  # common MLCC rated voltages (Murata 0G/0J/1A/1C/1E/1V/1H/2A..., YAGEO 4/5/6/7/8/0...)
  standard_ratings: [2.5, 4, 6.3, 10, 16, 25, 35, 50, 63, 100, 200, 250, 500, 630, 1000, 2000, 3000]
  # how to recognise an MLCC: BOM description regex (stuffed parts)
  mlcc_bom_regex: '\bMLCC\b'
  # for DNP caps (no BOM line) fall back to the netlist primitive name               (DEFAULT)
  mlcc_primitive_regex: '^C_TX_C\d{4}'
  # CONFIRMED: non-MLCC (polymer / electrolytic / tantalum) are reported as INFO ratio only
  non_mlcc_report: info
  # 2026-10-22: when the BOM text gives no type (OrCAD Capture BOM = value only, or no BOM) the DSN CIS property text
  # is searched with mlcc_bom_regex (Pegatron CIS: Component_Name 'MLCC 0.1UF/16V X7R 5%')            (DEFAULT)
  mlcc_dsn_properties: [Component_Name, Description]
  # besides the summary row, one CAP_UNRESOLVED row per unresolved net carrying its caps, so each can be found on
  # the PDF (destination + bookmark; boxed only if the severity is in annotate.box_severities)          (DEFAULT)
  unresolved_per_net: true
  unresolved_severity: INFO

net_voltage:
  # A voltage token in a net name (3V3, P12V, 4V85) is ignored when ANY token in the name
  # is in this list (trailing digits ignored: DIV2 = DIV). Unresolved nets go to rail_map_todo.csv.
  # Supply words (VCC/PVCC/VDD/BIAS...) are accepted only right after the voltage token:
  # 'HSC1_4V85_VDD' -> 4.85 V, but 'PS_12V_STBY_PVCC' -> unresolved.
  blacklist: [EN, ENA, PG, PGOOD, PWRGD, PGD, SS, FB, COMP, ILIM, ILM, RT, MODE,
              SYNC, BOOT, BST, SW, PH, LX, LG, HG, UG, VALID, FLAG, SENSE, SNS, CS, ISNS, VSNS,
              DIV, MON, IMON, VMON, TUNE, CONFIG, CFG, ALERT, RST, RESET, FAULT, FLT, OK, DET,
              PRSNT, CTRL, GATE, GT, DRV, LDRV, HDRV, TMR, TIMER, OV, UV, UVLO, OVLO, ADC, SDA,
              SCL, CLK, DATA, RC, RIC, EXTBIAS, HVBIAS, REF, VREF, TRIP, OCP, OVP, LOW, HIGH,
              NC, SNN, N, P]
  # propagate a known voltage across stuffed tie parts (0R, fuse, net-tie, bead)
  propagate: true
  # capacitor check only (2026-10-22, QA): VDD_12V / VCC_3V3 style names (supply word FIRST, voltage token right
  # after it) give a voltage marked 'legacy prefix, unverified'; an MLCC fail resting on it is WARN. The naming
  # rule v0.2 writes rails P<voltage> (P12V), so these names are pre-rule boards.                     (DEFAULT)
  legacy_prefix_words: [VDD, VCC]

naming:
  enabled: false             # company naming rule not yet enforced on this board family
  auto_net_regex: '^N\d+$'   # tool-generated net names (unnamed wire). Always checked (DRC).
  series_suffixes: [_R, _C]
  diff_pair_suffixes: [[_DP, _DN], [_P, _N]]

drc:
  similar_names: true
  floating_after_dnp: true
  # nets / pins that are deliberately unconnected: single-pin and floating checks report INFO
  intentional_nc_net_regex: '^(SNN|NC)_'
  # CONFIRMED (owner, 2026-10-22): a wire without a net name is not an electrical error and CRB designs have many,
  # so AUTO_NET_NAME is INFO (was WARN). A net that BECOMES tool-named between revisions is still WARN (NET_RENAMED).
  auto_net_severity: INFO
  # CONFIRMED (owner, 2026-10-27): a net holding only capacitors is a normal filter-cap drawing (source elsewhere), so
  # CAP_ONLY_NET is INFO: in the Excel list, no PDF box. "auto" = ERROR (parallel caps on a dead rail) / WARN (series
  # mid-point) / INFO (all DNP) as before.
  cap_only_severity: INFO
  nc_pin_name_regex: '^(NC|N\.C\.|DNC|RSVD|RESERVED)(_?\d+)?$'

bom:
  # BOM Ref Des entries that are not a plain RefDes (Agile "FOR J2" = programmed part inserted in socket J2).
  # Mapped by netlist topology (autocheck/bom_socket.py): parts stacked on the socket's nets. CONFIRMED approach
  # (owner 2026-10-13); thresholds DEFAULT.
  socket:
    socket_ref_patterns: ['^FOR\s+(\S+)$']   # group 1 = socket RefDes; add other company spellings here
    match_ratio: 0.8      # share of the candidate's pins on the socket's nets (or same pin no. on same net)
    min_pin_ratio: 0.5    # candidate must have >= this x socket pin count (keeps 2-pin R / C out)
    min_pins: 3           # distinctive pins (not ground, not no-connect) the candidate must have
    ignore_net_regex: '^(NC|N\.C\.|DNC|NC_.*|SNN_.*)$'   # no-connect nets, dropped like ground.regex nets

bomchk:
  # Existing rule BOM_MPN_NOT_FOUND (U / Q symbol MPN not in BOM text). Owner 2026-10-22: INFO -> WARN for now,
  # revisit after RD feedback. CONFIRMED
  mpn_not_found_severity: WARN
  # G0 BOM_NETLIST_MISMATCH (power tree v4.6 §G0, owner decisions 2026-10-22). One row per part that is in the BOM
  # AND the netlist. Key: netlist part property (Concept NV_PN) vs BOM Number + AML alternates; without that
  # property (OrCAD), symbol VALUE vs BOM text (passives by value, others by MPN text).
  #   value or part type differs                      -> value_diff_severity (all prefixes)       CONFIRMED
  #   PN / MPN differs, value not comparable          -> strong_severity for strong_prefixes, else other_severity
  #   PN differs, same type and value (2nd source)    -> statistics only, no finding            CONFIRMED
  # A part already reported by BOM_VALUE_MISMATCH / BOM_MPN_NOT_FOUND gets no second finding.
  netlist_pn_props: [NV_PN]
  strong_prefixes: [U, Q, L, RS]        # CONFIRMED: also the power tree ⚠ set (converter IC + L / FET / shunt)
  value_diff_severity: WARN
  strong_severity: WARN
  other_severity: INFO
  skip_prefixes: [H, TP, VS, NT, MH, FID]   # copper / mechanical, never compared (mechanical_refdes_regex too) DEFAULT
  # value kind per RefDes prefix (prefix = letters before the first digit)                              DEFAULT
  value_kind: {C: cap, R: res, RS: res, L: ind}
  # BOM description words that name a part type (full description searched, case-insensitive)          DEFAULT
  type_regex:
    cap: '\bCAP\b|\bMLCC\b|CAPACITOR|\bCAP\.'
    res: '\bRES\b|RESISTOR|\bRES\.'
    ind: '\bIND\b|INDUCTOR|\bCHOKE\b'

pin_roles:
  # Netlist rules (2026-10-09, HANDOVER 0u): what a pin IS, judged from its pstchip pin name.
  # Full-match, case-insensitive regex. DEFAULT: tuned on the CATANIA symbols; edit when a library names pins
  # differently. Nothing in the code knows a pin name; add / widen patterns here.
  supply:     'VCC\w*|VDD\w*|AVDD\w*|DVDD\w*|V\+|VS|VAUX|BIAS|PVCC|VIO'      # IC logic supply (power domain)
  ground:     'GND\w*|[ACDPS]GND\w*|PGND\d*|VSS\w*|VEE|V-'
  open_drain: 'PG|PGOOD|PGD|PWRGD|POWER_?GOOD|PG/SS|PG/SYNCOUT|ALERT#?|SMBALERT#?|ALERT_?N|FLT#|FAULT#|SDA|SCL|SMBDAT|SMBCLK|CRITICAL|WARNING'
  # names that are open-drain on supervisors / expanders but often push-pull-driven INPUTS elsewhere:
  # a node with only these is reported as INFO (QA 2026-10-09)
  open_drain_maybe: 'INT#|INT_?N|IRQ#|IRQ_?N|RESET#|RST#|RESET_?N|RST_?N'
  strap:      'ADR\d*|ADDR\d*|A[0-7]|E[0-2]|STRAP\w*|CFG\d*|CONFIG\d*|MODE\d*|SEL\d*|BOOT_?SEL\d*'
  # regulators / switches (B1 power tree)
  reg_in:     'P?VIN\d*([_-][\w-]*)?|IN'
  reg_out:    'V?OUT\d*|VO'
  reg_sw:     'SW\d*([_-][\w-]*)?|LX\d*|PH'
  reg_gate:   'GATE\d*|HDRV|HG|UG'
  reg_en:     'EN|ENABLE|EN/UV|EN/UVLO|EN#/OVLO|CE'
  reg_pg:     'PG|PGOOD|PGD|PWRGD|POWER_?GOOD|PG/SS|PG/SYNCOUT'
  # discrete FET pins (power tree FET edges; C3 FET_GATE_LEVEL 2026-10-21): G / GATE / GATE1, S / SOURCE / SOURCE_1..3
  fet_gate:   'G\d*|GATE_?\d*'
  fet_source: 'S\d*|SOURCE_?\d*'
  fet_drain:  'D\d*|DRAIN_?\d*'
  vbat:       'VBAT\w*'      # battery / RTC input: a power pin for C1 decoupling only, never a logic supply (A3)
  # analog / high-voltage sense pins: A3 never compares their level with the IC supply
  analog:     'SENSE\w*|ISNS\w*|IN[+-]\d*|IN[+-]|VIN_K|DIODE|CS[+-]?|FB\d*|COMP|ILIM|ILM|CL|RT|SS|TIMER|ITIMER|DVDT|REF\d*|REXT/CEXT|CEXT|INVERTING/INPUT|NON_INVERTING/INPUT'
  # pins whose role depends on the part, not the name (e.g. open-drain buffer outputs named Y). mpn / pin: regex
  by_part:
    - {mpn: '.*74\w*G0[67]\w*|TC7SZ0[67]\w*', pin: '\d?Y', role: open_drain}

netrules:
  # A1 / A2 / A3 (DEFAULT 2026-10-09, owner approved the rule list; thresholds pending review)
  enabled: [STRAP, OPEN_DRAIN, PULLUP_DOMAIN, DECOUPLE, PULLUP_DOUBLE, FET_GATE_LEVEL]
  # C3 FET_GATE_LEVEL (checklist #17, 2026-10-21): every built FET (these RefDes prefixes) gets one INFO row with
  # Vg / Vs / Vgs from the DC level of its gate / source nets (pin_roles fet_gate / fet_source / fet_drain). Vth is
  # not in the tool: the RD compares against the datasheet. BJTs (BASE / EMITTER) are not covered.
  fet_prefixes: [Q, PQ]
  # C1 DECOUPLE (checklist #14, 2026-10-20): a built IC supply net with no built cap -> WARN; caps but none in
  # [decouple_min_f, decouple_max_f] -> INFO. Placement is not in the netlist.
  capacitor_prefixes: [C]
  # pin roles C1 treats as "power pin" (checklist #14). reg_in / vbat are NOT added to pin_roles.supply:
  # supply drives A3 (supplies_of -> PULLUP_OVERVOLT compares against the highest supply) and NetGraph rails,
  # so a controller's VIN there would silence over-voltage checks on its logic pins (QA 2026-10-20 #1).
  # a pin that is also 'analog' (VIN_K Kelvin sense, VINMON) is skipped.
  decouple_roles: [supply, reg_in, vbat]
  decouple_min_f: 1.0e-8
  decouple_max_f: 1.0e-6
  # C2 PULLUP_DOUBLE (checklist #8 / #12): >= 2 built pull-ups on one node (I2C lines left to I2C_PU_DUPLICATE)
  ic_prefixes: [U]
  resistor_prefixes: [R, RS]   # 2-pin resistors (values: 100KOHM / 10K / 4K7 / 4.7k / 1M styles). Arrays (RN) not handled
  offboard_prefixes: [J, CN]   # an open-drain node that reaches these may have its pull-up on the other board
  # resistors at or below this value between two signal nets are walked through (series / damping R), so
  # HSC1_SMB_DATA -33.2R- I2C_SDA_SLAVE is one node. Never walked into a rail or ground.
  series_max_ohm: 100
  # A2 pull-up too strong: parallel pull-up < Rp(min) = (V - VOL) / IOL (I2C: IOL 3 mA, VOL 0.4 V)
  od_vol_v: 0.4
  od_iol_ma: 3.0
  # A2: an open-drain node counts as pulled up when the DC level of its resistor network (driver released)
  # reaches this voltage; a pull-up through a 1K isolation resistor still counts
  od_high_min_v: 0.7
  # A1: strap pins that are DESIGNED for a resistor divider (multi-level pins). mpn / pin regex, full match
  strap_divider_allowed: []
  # A3: input above receiver supply by more than this -> PULLUP_OVERVOLT
  overvolt_margin_v: 0.3

rail_domain:
  # A3 back-power. Domain = when a rail has power. order: earlier = on longer (AON before STBY before MAIN).
  # A pull-up rail earlier than the receiver's supply rail back-powers the receiver when its rail is off.
  # The tool guesses domains from rail names (below) and writes rail_domain_<rev>.csv; the owner reviews it,
  # sets confirmed = Y, and passes it back (--rail-domain / UI). Unconfirmed -> INFO, confirmed -> WARN.
  order: [AON, STBY, MAIN]
  guess:
    - {domain: AON,  regex: '(^|_)(AON|ALWAYS_?ON)(_|$)'}
    - {domain: STBY, regex: '(^|_)(STBY|STANDBY|SB|AUX|S5)(_|$)'}
    - {domain: MAIN, regex: '(^|_)(RUN|MAIN|S0)(_|$)'}

power_tree:
  # B1: converters are ICs with a reg_in pin plus reg_out / reg_sw / reg_gate. SW is followed through an
  # inductor, GATE through series R (<= netrules.series_max_ohm) to FET gates and out the FET's other pins.
  # Rails are grouped through 0R / fuse / bead / net-tie / series R <= series_max_ohm / multi-pin mOhm shunts,
  # never into ground, never between two different known voltages, never into a signal net.
  inductor_prefixes: [L]
  fet_prefixes: [Q]
  # 2026-10-13 (OTA01 DC-SCM): power-section RefDes. The tree reads these as the right-hand prefix (PU1 = an IC,
  # PL1 = an inductor, PR / PFB = series R / bead). Power tree only: netrules / capv keep their own prefix lists.
  prefix_aliases: {PU: U, PL: L, PQ: Q, PR: R, PFB: FB, PF: F, PD: D}
  # OrCAD makes duplicate pin names unique as NAME#<own pin number> (VIN#4, GND#2, VCC_DDR_VDDQ#M6): cut that
  # suffix before the pin_roles match. Only the pin's own number is cut (RESET# / OE# untouched).
  strip_duplicate_pin_suffix: true
  # board-to-board connectors whose RefDes prefix is not in netrules.offboard_prefixes (OTA01: DC-SCI_GF1 gold
  # finger). Full match. Power tree only.
  connector_refdes_regex: 'DC-SCI_GF\d*'
  # a leading supply word names the rail, not a bias pin: VCC_BMC_0V8 -> 0.8 V, VCC_12V -> 12 V (tree only;
  # capv keeps the stricter rule: supply word only right after the voltage token)
  name_prefix_words: [VCC, VDD, PVCC, AVDD, DVDD, VDDA, VDDIO]
  # diode feed edges (diode-OR / isolation): anode / cathode by pin number or pin name, full match
  diode_anode_pin: 'A|ANODE'
  diode_cathode_pin: 'K|C|CATHODE'
  # rail voltage sources (2026-10-13, owner choice B), first one wins, the rest are a cross-check:
  # rail_map > FB divider (library vref) > net name > switch output = input > load supply pin name (VCC_PECIVDD_1V0)
  # > load spec library (DDR5 VDD 1.1 V) > board connector pin name (P3V0_HPM_SCM_BAT) > diode (input, no Vf: "≈")
  library: power_parts.yaml          # relative to this config folder; vref / type per converter, load supply specs
  # BOM text of parts not in the library, only for LDO / switch type edges (a switcher never passes its input)
  load_switch_desc_regex: '\b(LOAD|POWER|PWR)\s*SW(ITCH)?\b(?!ING)|\bE-?FUSE\b'
  load_switch_desc_exclude: '\bLDO\b|REGULAT|\bREG\b|LINEAR|BUCK|BOOST|CONVERTER'
  voltage_conflict_abs: 0.05         # exact sources disagree when |dV| > max(abs, pct of the chosen value)
  voltage_conflict_pct: 3.0

i2c:
  # I2C map (2026-10-12, owner request, TEST STATE). Derives the I2C map from netlist + BOM + the device library
  # and compares it with the transcribed I2C block diagram (i2c_map_declared*.csv, owner signs it off).
  # SI items (bus capacitance, Rp min / max, rise time) are out of scope (owner decision 2026-10-12).
  enabled: true
  library: i2c_devices.yaml          # relative to this config folder; one entry per part family, datasheet URL each
  user_library: i2c_devices_user.yaml   # entries RD signed from an uploaded datasheet (UI "I2C 位址庫" / autocheck i2c-accept);
                                      # searched before the built-in file
  datasheets_dir: datasheets          # relative to the AutoCheck folder: drop datasheet PDFs here (file name = MPN)
  # I2C line pins on ICs (pin name, full match, case-insensitive). LM5066 SDAI / SDAO both count as SDA.
  sda_pin: 'SDA|SDAI|SDAO|SMBDAT|SMB_?DATA|I2C_?SDA'
  scl_pin: 'SCL|SMBCLK|SMB_?CLK|I2C_?SCL'
  # Severity of every I2C rule. Owner 2026-10-12: all INFO while the feature is in test; change here any time.
  severity:
    I2C_ADDR_CONFLICT: INFO        # two built devices with the same 7-bit address in one address space
    I2C_PU_DUPLICATE: INFO         # more than one built pull-up on one line of one segment
    I2C_NO_PULLUP: INFO            # segment without any built pull-up and without an IC pin (A2 covers IC pins)
    I2C_SDA_SPLIT: INFO            # a device's SDA pins (LM5066 SDAI / SDAO) not on one segment
    I2C_ADDR_PIN_FLOAT: INFO       # address pin left open on a part that does not define open
    I2C_ADDR_UNRESOLVED: INFO      # strap state unknown / conflicting, or state combination not in the table
    I2C_ADDR_PART_DIFF: INFO       # symbol / BOM main / alternates decode to different addresses
    I2C_LIB_MISSING: INFO          # I2C part not in the library (or no table yet): strap states only
    I2C_DECLARED_MISMATCH: INFO    # I2C block diagram (declared csv) disagrees with the netlist
    I2C_UNDECLARED_DEVICE: INFO    # built I2C device on the netlist but not on the I2C block diagram
    I2C_SECOND_SOURCE_UNCHECKED: INFO  # BOM main / alternate / symbol of an I2C device not in the library: strap not checked for it
    I2C_ADDR_RESERVED: INFO        # built device decodes to a reserved 7-bit address (checklist #74)
  # I2C-bus specification UM10204 rev 7 table 4 (https://www.nxp.com/docs/en/user-guide/UM10204.pdf):
  # 0000 000 general call / START byte, 0000 001 CBUS, 0000 010 other bus, 0000 011 future, 0000 1XX Hs-mode
  # master code, 1111 1XX device ID, 1111 0XX 10-bit addressing. 7-bit ranges, inclusive.
  reserved_addr7: [[0, 7], [120, 127]]

annotate:
  # schematic PDF annotation (v0.2). Boxes drawn for these severities; destinations/bookmarks for dest_severities
  box_severities: [ERROR, WARN]
  # 2026-10-22 (owner): power / connectivity findings also box the net-name text near their parts (nearest N per
  # net per page, ground nets never). Only pages that already carry a part box of the row.
  # 2026-10-27 (owner, 丙): NET_SHORTED boxes ONE net label = a net of the NEW super-net (the nets column holds the old
  # names plus every new net; old names are the key). Before: three labels per short. Code: pdf_annotate.locate.
  net_label_rules: [CAP_ONLY_NET, NET_SPLIT, NET_MERGED, NET_SHORTED, CAP_UNRESOLVED]
  net_label_max_per_page: 1
  # 2026-10-27 (owner): net-level findings list every part on the net as evidence (NET_SHORTED on the TPM kit boxed R2803,
  # R2808, TP108, U280, J55 ... all as '#2'). These rules box ONLY the first located RefDes (the jump target); the full
  # list stays in the Excel RefDes column. Reviewers' eyes first, evidence second.
  anchor_only_rules: [NET_SHORTED, CAP_ONLY_NET, NET_SPLIT, NET_MERGED]
  # 2026-10-27 15:09 (owner): NET_SPLIT / NET_MERGED box the net label ONLY (B = new name, A = old name), the anchor part
  # is boxed only when no label is found nearby. NET_SHORTED already works this way through its own branch.
  label_only_rules: [NET_SPLIT, NET_MERGED]
  net_label_max_dist_pt: 160   # a same-named label farther than this from the parts is not boxed
  # findings about ONE pin of an active part (parts.active_prefixes: U / J / Q ...) box that pin's net name next to the part instead of the RefDes
  # (fallback: the RefDes) so findings on J55.3 / J55.4 / J55.9 are separate boxes (owner 2026-10-22)
  pin_label_rules: [SINGLE_PIN_NET, PIN_ISOLATED, PIN_MOVED, PIN_DISCONNECTED, PIN_CONNECTED]
  dest_severities: [ERROR, WARN, INFO]
  # 2026-10-27 B-full root-cause grouping (owner decision A): a child row (tracking.link_root_causes, see rootcause:) is not
  # boxed when its parent is boxed on the same drawing and the child is not more severe than the parent. The child keeps
  # its named destination / bookmark / Excel link; the parent's comment lists its children. Rules listed in
  # child_keep_box_rules always keep their box: PIN_ISOLATED marks the OPEN end of a short, which sits elsewhere on the
  # page and the parent's net-label boxes do not mark it.
  hide_child_boxes: true
  child_keep_box_rules: [PIN_ISOLATED]
  # Jump to a box (Excel PDF column, 審查回覆「看圖」, index page links):
  #   fitr (default): /FitR = the view_pt area centred on the box; the viewer scales it to fill its own window,
  #                   so every screen / Windows scale / window size shows the same area (zoom differs per screen).
  #                   Chrome: zoom = min(window w / rect w, window h / rect h), 1 pt = 4/3 px, max 500 %.
  #                   A window wider (or taller) than view_pt's aspect leaves the spare room on the right (or bottom).
  #   xyz:            /XYZ fixed zoom + window size assumed = view_pt (old behaviour, centred only on the test laptop).
  jump: fitr
  zoom: 2.0                  # xyz only: viewer zoom when jumping to a box
  box_padding: 3.0           # points around the RefDes text
  box_line_width: 0.6        # pt, ERROR / WARN boxes; INFO boxes use half. Owner 2026-10-27: halved from 1.2 (too loud)
  # page area (w, h, PDF points) shown around the box. 460 x 275 = what the test laptop showed at 200 %
  # (1920x1200, Windows 125 %, Chrome maximised, thumbnails open), measured 2026-10-09. Bigger = more context.
  view_pt: [460, 275]
  # 「最佳觀看設定」提示，只有 jump: xyz 會顯示。fitr 不看這行，提示文字固定在 autocheck/review.py view_hint()
  view_hint: 螢幕 1920 x 1200、Windows 顯示比例 125%、Chrome 視窗最大化、PDF 左側縮圖欄開著

publish:
  # where the annotated PDF is copied so a browser can open it over http (Streamlit static serving,
  # .streamlit/config.toml: [server] enableStaticServing = true). Excel links = base_url/<run>/<pdf>#nameddest=<key>
  static_dir: static         # relative to the AutoCheck folder
  base_url: http://localhost:8501/app/static

review:
  # RD replies (web page 審查回覆): one SQLite file, keyed by run + tracking key, survives re-runs.
  # Env AUTOCHECK_REVIEW_DB overrides (tests use it). Relative to the AutoCheck folder.
  db: review/review.db

# Root-cause grouping of tracking rows (2026-10-27 B-full; tracking.link_root_causes, after expand_rows). parent rule ->
# child rules it may claim. A child has ONE parent (the lowest 項次 that matches), a parent-rule row is never a child, and
# every row keeps its own key / severity / status / title / detail (regression rule). Shown as the Excel 父項 column and
# the 「同根因 → #n」 prefix (rendered, not stored), folded by default on the web review page (owner decision B 乙: replies are
# NOT copied to children; the progress counts just leave children out). Matching rules: tracking.py DEFAULT_PARENTS.
rootcause:
  enabled: true
  # only NET_SHORTED and CAP_ONLY_NET have matching code (tracking._is_child_of); another parent rule listed here never matches
  parents:
    NET_SHORTED: [NET_SPLIT, NET_MERGED, PIN_MOVED, PIN_DISCONNECTED, PIN_CONNECTED, PIN_ISOLATED, SINGLE_PIN_NET]
    CAP_ONLY_NET: [MLCC_DERATING, CAP_UNRESOLVED, NET_SPLIT]
