<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360" role="img" aria-labelledby="title desc">
  <title id="title">版本資料夾範例</title><desc id="desc">EVT 版本資料夾內有 BOM、Netlist、Schematic 子資料夾，分別放用料表、三份 DAT 與電路圖 PDF。</desc>
  <defs><g id="folder" fill="none" stroke="#64cabc" stroke-width="2.5" stroke-linejoin="round"><path d="M1 7V3h10l4 4h18v20H1Z"/><path d="M1 7h32"/></g></defs>
  <rect width="640" height="360" rx="12" fill="#1b1b1d"/>
  <g font-family="Segoe UI,Microsoft JhengHei,sans-serif">
    <text x="28" y="42" fill="#f2f2f3" font-size="24" font-weight="700">版本資料夾：EVT</text>
    <text x="28" y="74" fill="#b7b7bd" font-size="18">A 選舊版 EVT，B 選新版 DVT</text>
    <path d="M44 124v172M44 148h24M44 218h24M44 288h24" fill="none" stroke="#55555e" stroke-width="2"/>
    <g transform="translate(78 127)"><use href="#folder"/><text x="49" y="20" fill="#f2f2f3" font-size="22" font-weight="650">BOM</text><text x="258" y="20" fill="#b7b7bd" font-size="19">零件用料表</text></g>
    <g transform="translate(78 197)"><use href="#folder"/><text x="49" y="20" fill="#f2f2f3" font-size="22" font-weight="650">Netlist</text><text x="258" y="20" fill="#b7b7bd" font-size="19">三份 .dat 檔案</text></g>
    <g transform="translate(78 267)"><use href="#folder"/><text x="49" y="20" fill="#f2f2f3" font-size="22" font-weight="650">Schematic</text><text x="258" y="20" fill="#b7b7bd" font-size="19">電路圖 PDF</text></g>
    <text x="28" y="336" fill="#64cabc" font-size="18">選整個版本資料夾，系統會讀取其中的子資料夾。</text>
  </g>
</svg>
