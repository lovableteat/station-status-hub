name: Release quality gate
# Pages calls this workflow for the exact main commit before building or deploying.
# The same checks run on pull requests; isolated fixtures never use production secrets.
on:
  workflow_call:
  pull_request:
    branches: [main]
  push:
    branches: ["fix/release-quality-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      VITE_SUPABASE_URL: http://127.0.0.1:54321
      VITE_SUPABASE_ANON_KEY: isolated-test-key
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci --legacy-peer-deps
      - name: Set isolated QA directory
        run: echo "AUDIT_QA_DIR=$RUNNER_TEMP/station-audit-qa" >> "$GITHUB_ENV"
      - name: Install isolated QA dependencies
        run: npm install --prefix "$AUDIT_QA_DIR" --no-package-lock react@18.3.1 react-test-renderer@18.3.1 jsdom@29.1.1 @electric-sql/pglite@0.5.8
      - name: Application and build configuration types
        run: npm run typecheck
      - name: Source quality
        run: npm run lint
      - name: Complete unit and source contracts
        run: npm test
      - name: Reject high and critical dependency advisories
        run: npm audit --audit-level=high
      - name: Anonymous data exposure and authenticated compatibility
        run: node tests/anonymousExposure.integration.mjs "$AUDIT_QA_DIR/node_modules/@electric-sql/pglite"
      - name: Staged security proposals preserve operating data and attachment access
        run: PGLITE_MODULE="$AUDIT_QA_DIR/node_modules/@electric-sql/pglite/dist/index.js" node --test tests/remainingSecurity.postgres.mjs tests/securityProposalCutover.postgres.mjs
      - name: Deferred requests, live events, drafts and permissions
        run: node --test tests/audit*.integration.cjs
