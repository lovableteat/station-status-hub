name: Exact current68 cross-release draft research
on:
  pull_request:
    branches: [main]
permissions:
  contents: read
  actions: read
jobs:
  exact68_pair:
    if: github.event_name == 'pull_request' && github.event.pull_request.number == 49 && github.event.pull_request.head.ref == 'fix/legacy-pcb-protected-reads-20261112' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Allocate isolated paths
        run: |
          echo "EXACT68_PAIR_DIST=$RUNNER_TEMP/exact68-selected" >> "$GITHUB_ENV"
          echo "EXACT68_PAIR_EVIDENCE_DIR=$RUNNER_TEMP/exact68-evidence" >> "$GITHUB_ENV"
          echo "AUDIT_QA_DIR=$RUNNER_TEMP/exact68-qa" >> "$GITHUB_ENV"
      - run: npm ci --legacy-peer-deps
      - run: npm install --prefix "$AUDIT_QA_DIR" --no-package-lock jsdom@29.1.1 playwright@1.58.2
      - run: node --test tests/exact68pair/research.test.cjs tests/exact80/exact80-server.test.cjs tests/exact80/exact80-fixtures.test.cjs
      - name: Obtain hash-pinned existing public build, never publish bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          curl --fail --silent --show-error --location --max-time 90 \
            -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/lovableteat/station-status-hub/actions/artifacts/13961468119/zip \
            --output "$RUNNER_TEMP/exact68-source.zip"
          python tests/exact80/extract-exact80.py "$RUNNER_TEMP/exact68-source.zip" "$EXACT68_PAIR_DIST" tests/exact68pair/manifest.json
      - uses: actions/checkout@v4
        with:
          ref: 149184847764466db200250aff8c716dde46720a
          path: .exact68-candidate
          persist-credentials: false
      - name: Verify identical dependency lock and build immutable candidate
        working-directory: .exact68-candidate
        run: |
          cmp package-lock.json "$GITHUB_WORKSPACE/package-lock.json"
          ln -s "$GITHUB_WORKSPACE/node_modules" node_modules
          node "$GITHUB_WORKSPACE/tests/exact68pair/build-candidate.mjs"
      - name: Verify exact inputs before launching
        env:
          EXACT68_PAIR_BUILD_ONLY: '1'
          EXACT68_PAIR_CANDIDATE_DIST: ${{ github.workspace }}/.exact68-candidate/dist
        run: node tests/exact68pair/crossrelease.browser.cjs
      - run: "$AUDIT_QA_DIR/node_modules/.bin/playwright install --with-deps chromium"
      - name: Real Chromium with intercepted synthetic services only
        env:
          EXACT68_PAIR_CANDIDATE_DIST: ${{ github.workspace }}/.exact68-candidate/dist
        run: timeout --signal=TERM --kill-after=10s 300s node tests/exact68pair/crossrelease.browser.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: exact68-crossrelease-synthetic-evidence
          retention-days: 3
          if-no-files-found: error
          path: |
            ${{ runner.temp }}/exact68-evidence/report.json
            ${{ runner.temp }}/exact68-evidence/*.png
