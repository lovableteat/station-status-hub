name: Supabase Keep Alive

on:
  schedule:
    - cron: '0 0 */3 * *' # 每 3 天跑一次
  workflow_dispatch: # 允許手動測試

jobs:
  ping_supabase:
    runs-on: ubuntu-latest
    steps:
      - name: Force Database Activity
        env:
          SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: |
          # Execute a constant-only database query, never expose application rows.
          response=$(curl --fail-with-body --silent --show-error \
            --connect-timeout 10 --max-time 30 --retry 2 \
            "${SUPABASE_URL}/rest/v1/rpc/database_healthcheck" \
            -H "apikey: ${SUPABASE_ANON_KEY}" \
            -H "Authorization: Bearer ${SUPABASE_ANON_KEY}" \
            -H "Accept-Profile: public")
          test "$response" = 'true'
