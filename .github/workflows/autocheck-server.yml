name: AutoCheck server tests
on:
  push:
    branches: [ main ]
    paths: [ 'server/**', 'public/comparison/**', 'tests/comparison/fixtures/**', '.github/workflows/autocheck-server.yml' ]
  pull_request:
    paths: [ 'server/**', 'public/comparison/**', 'tests/comparison/fixtures/**', '.github/workflows/autocheck-server.yml' ]
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: server/requirements-dev.txt
      - run: pip install -r server/requirements-dev.txt
      - run: python -m pytest tests -q
        working-directory: server
        env:
          PYTHONIOENCODING: utf-8
